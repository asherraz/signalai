name: Daily SignalAI intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signalai-main
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
      OPENAI_CHAIR_REASONING_EFFORT: ${{ vars.OPENAI_CHAIR_REASONING_EFFORT || 'medium' }}
      OPENAI_MAX_OUTPUT_TOKENS: "2500"
      OPENAI_CHAIR_MAX_OUTPUT_TOKENS: "6000"
      OPENAI_CHAIR_RETRY_MAX_OUTPUT_TOKENS: "8000"
      OPENAI_DESIGN_MODEL: ${{ vars.OPENAI_DESIGN_MODEL || vars.OPENAI_MODEL || 'gpt-5-mini' }}
      OPENAI_DESIGN_REASONING_EFFORT: ${{ vars.OPENAI_DESIGN_REASONING_EFFORT || 'low' }}
      OPENAI_DESIGN_CHAIR_REASONING_EFFORT: ${{ vars.OPENAI_DESIGN_CHAIR_REASONING_EFFORT || 'medium' }}
      OPENAI_DESIGN_MAX_OUTPUT_TOKENS: "5000"
      OPENAI_DESIGN_CHAIR_MAX_OUTPUT_TOKENS: "2500"
      OPENAI_DESIGN_RETRY_MAX_OUTPUT_TOKENS: "6000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SignalAI
        run: python -m pip install -e .
      - name: Run one bounded intelligence cycle
        id: run
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m signalai daily)"
          echo "$output"
          echo "run_id=${output##* }" >> "$GITHUB_OUTPUT"
      - name: Run one bounded Product Design Lab cycle
        id: design
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m signalai design-lab)"
          echo "$output"
          echo "run_id=${output##* }" >> "$GITHUB_OUTPUT"
      - name: Discover molecular-atlas papers and public omics records
        shell: bash
        env:
          SIGNALAI_ATLAS_RESULTS_PER_QUERY: "5"
        run: python -m signalai molecular-atlas-discover
      - name: Advance the fictional clinic demonstration
        shell: bash
        run: python -m signalai clinic-simulate
      - name: Commit validated generated state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if python -m signalai should-commit; then
            git config user.name "signalai-bot"
            git config user.email "signalai-bot@users.noreply.github.com"
            git add public state runs design-runs simulation-runs
            git commit -m "chore: autonomous SignalAI run ${{ steps.run.outputs.run_id }}"
            git push origin HEAD:main
          else
            echo "No material change beyond volatile timestamps; skipping commit."
          fi
