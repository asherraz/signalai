[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "signalai"
version = "0.1.0"
description = "AI-native therapeutic asset development system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.scripts]
signalai-run = "signalai.cli:main"
signalai-daily-run = "signalai.cli:daily_main"
signalai-agenda-daily-run = "signalai.cli:agenda_daily_main"
signalai-migrate-legacy = "signalai.cli:migrate_legacy_main"
signalai-publish-state = "signalai.cli:publish_state_main"
signalai-should-commit = "signalai.cli:should_commit_main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signalai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
